<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Prefecture Density Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    :root {
        --bg-body: #f4f4f9; --bg-sidebar: #ffffff; --text-main: #333333; --text-muted: #555555;
        --border-color: #cccccc; --bg-input: #ffffff; --bg-details: #f8f9fa; --bg-hover: #e9e9e9;
    }
    body.dark-mode {
        --bg-body: #121212; --bg-sidebar: #1e1e1e; --text-main: #e0e0e0; --text-muted: #aaaaaa;
        --border-color: #444444; --bg-input: #2d2d2d; --bg-details: #252525; --bg-hover: #333333;
    }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-body); color: var(--text-main); }
    #sidebar { width: 350px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); box-shadow: 2px 0 5px rgba(0,0,0,0.1); padding: 15px; box-sizing: border-box; overflow: hidden; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .settings-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
    #map { flex-grow: 1; height: 100%; background: var(--bg-body); }
    h2 { margin: 0 0 10px 0; font-size: 20px; color: var(--text-main); }
    
    details { border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-sidebar); overflow: hidden; }
    summary { font-weight: 600; font-size: 14px; padding: 12px 15px; background: var(--bg-details); cursor: pointer; list-style: none; user-select: none; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▼"; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(180deg); }
    details[open] summary { border-bottom: 1px solid var(--border-color); }
    .details-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; background: var(--bg-sidebar); }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .checkbox-group { flex-direction: row; align-items: center; gap: 8px; margin-top: 5px; }
    label { font-weight: 600; font-size: 13px; color: var(--text-muted); }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; font-size: 13px; background: var(--bg-input); color: var(--text-main); }
    input[type="range"] { width: 100%; cursor: pointer; }
    input[type="range"]:disabled, input[type="number"]:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .number-input-wrapper { float: right; margin-top: -6px; display: flex; align-items: center; gap: 4px; }
    .number-input-wrapper input { width: 65px; padding: 4px; text-align: right; height: 26px; }
    .unit-label { font-size: 12px; color: var(--text-muted); font-weight: normal; }

    .file-upload { border: 2px dashed var(--border-color); padding: 15px; text-align: center; border-radius: 6px; background: var(--bg-details); cursor: pointer; transition: background 0.2s; }
    .file-upload:hover { background: var(--bg-hover); }
    input[type="file"] { display: none; }
    .upload-label { cursor: pointer; color: #0066cc; font-weight: bold; font-size: 14px; }
    body.dark-mode .upload-label { color: #4da3ff; }
    .status { font-size: 12px; color: var(--text-muted); padding: 10px; border-radius: 4px; background: var(--bg-details); border: 1px solid var(--border-color); word-wrap: break-word; margin-top: 5px; }
    .tag-selector-list { display: flex; flex-direction: column; gap: 8px; }
    .tag-selector-row { display: flex; align-items: center; gap: 8px; }
    .tag-selector-row input { flex: 1; }
    .tag-selector-actions { margin-top: 8px; display: flex; }
    .tag-selector-btn { border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); border-radius: 4px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; line-height: 1; }
    .tag-selector-btn:hover { background: var(--bg-hover); }

    .btn-export { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px; }
    .btn-export:hover { background: #218838; }
    .btn-export:active { transform: scale(0.98); }
</style>
</head>
<body>
<div id="sidebar">
    <h2>Map Settings</h2>
    <div class="settings-scroll">

    <details open>
        <summary>Data & Filters</summary>
        <div class="details-content">
            <div>
                <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                    <span class="upload-label">📁 Click to Upload JSON</span>
                    <input type="file" id="fileInput" accept=".json">
                </div>
                <div id="fileStatus" class="status">No file loaded.</div>
            </div>
            <div class="control-group">
                <label for="targetTag">Target Tag(s)</label>
                <div id="tagSelectors" class="tag-selector-list">
                    <div class="tag-selector-row">
                        <input type="text" id="targetTag" class="target-tag-input" value="C-Type" list="tagSuggestions">
                    </div>
                </div>
                <div class="tag-selector-actions">
                    <button type="button" id="addTagSelectorBtn" class="tag-selector-btn" aria-label="Add tag selector">+</button>
                </div>
                <datalist id="tagSuggestions"></datalist>
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="autoMax" style="width: auto;">
                <label for="autoMax" style="margin: 0; cursor: pointer;">Auto-Scale Colors to Densest Area</label>
            </div>
            <div class="control-group">
                <label for="maxLocs">
                    Max Density Cap
                    <div class="number-input-wrapper">
                        <input type="number" id="maxLocsInput" min="1" max="1000" value="1">
                    </div>
                </label>
                <input type="range" id="maxLocs" min="1" max="1000" value="1">
            </div>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 0;">
            <div class="control-group">
                <label for="minLocs">
                    Min. Threshold / Cluster Cutoff
                    <div class="number-input-wrapper">
                        <input type="number" id="minLocsInput" min="1" max="500" value="1">
                    </div>
                </label>
                <input type="range" id="minLocs" min="1" max="500" value="1">
            </div>
            <div class="control-group">
                <label for="clusterReach">
                    Cluster Connection Reach (km)
                    <div class="number-input-wrapper">
                        <input type="number" id="clusterReachInput" min="1" max="150" value="15">
                    </div>
                </label>
                <input type="range" id="clusterReach" min="1" max="150" value="15">
            </div>
        </div>
    </details>

    <details open>
        <summary>Visual Style</summary>
        <div class="details-content">
            <div class="control-group">
                <label for="baseMap">Background Theme</label>
                <select id="baseMap">
                    <option value="white">Clean White (For Export)</option>
                    <option value="light">Carto Light</option>
                    <option value="dark" selected>Carto Dark</option>
                    <option value="satellite">Satellite Imagery</option>
                </select>
            </div>
            <div class="control-group">
                <label for="mapType">Overlay Mode</label>
                <select id="mapType">
                    <option value="prefecture">Prefecture Subdivision</option>
                    <option value="hex">Hexagon Grid (Solid)</option>
                    <option value="circles">Circle Grid (Solid)</option>
                    <option value="squared">Square Grid (Solid)</option>
                    <option value="fuzzy" selected>Fuzzy Heatmap (Blurred Edges)</option>
                    <option value="fuzzy_solid">Fuzzy Heatmap (Opaque Blobs)</option>
                </select>
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="clipCoast" checked style="width: auto;">
                <label for="clipCoast" style="margin: 0; cursor: pointer;">Clip Heatmap to Coastlines</label>
            </div>
            <div class="control-group">
                <label for="colorMap">Color Scheme</label>
                <select id="colorMap">
                    <option value="YlOrRd">Yellow-Orange-Red</option>
                    <option value="OrRd">Orange-Red</option>
                    <option value="PuRd">Purple-Red</option>
                    <option value="Spectral">Spectral</option>
                    <option value="viridis">Viridis</option>
                    <option value="inferno" selected>Inferno</option>
                    <option value="magma">Magma</option>
                </select>
            </div>
            <div class="control-group">
                <label for="opacity">
                    Fill Opacity
                    <div class="number-input-wrapper">
                        <input type="number" id="opacityInput" min="0" max="1" step="0.05" value="0.95">
                    </div>
                </label>
                <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.95">
            </div>
        </div>
    </details>

    <details open>
        <summary>Advanced Tuning</summary>
        <div class="details-content">
            <div class="control-group">
                <label for="resolution">
                    Shape Radius / Visual Size
                    <div class="number-input-wrapper">
                        <input type="number" id="resolutionInput" min="1" max="100" value="13">
                    </div>
                </label>
                <input type="range" id="resolution" min="1" max="100" value="13">
            </div>
            <div class="control-group">
                <label for="blur">
                    Blur Amount (Fuzzy Mode Only)
                    <div class="number-input-wrapper">
                        <input type="number" id="blurInput" min="1" max="100" value="19">
                    </div>
                </label>
                <input type="range" id="blur" min="1" max="100" value="19">
            </div>
            <div class="control-group">
                <label for="faintness">
                    Faintness Eraser (%)
                    <div class="number-input-wrapper">
                        <input type="number" id="faintnessInput" min="0" max="50" value="19">
                    </div>
                </label>
                <input type="range" id="faintness" min="0" max="50" value="19">
            </div>
            <div class="control-group">
                <label for="intensity">
                    Intensity Multiplier (Fuzzy Only)
                    <div class="number-input-wrapper">
                        <input type="number" id="intensityInput" min="1" max="200" step="1" value="83">
                        <span class="unit-label">x</span>
                    </div>
                </label>
                <input type="range" id="intensity" min="1" max="200" step="1" value="83">
            </div>
            <div class="control-group">
                <label for="borderWeight">
                    Border Thickness
                    <div class="number-input-wrapper">
                        <input type="number" id="borderWeightInput" min="0" max="5" step="0.5" value="1.0">
                    </div>
                </label>
                <input type="range" id="borderWeight" min="0" max="5" step="0.5" value="1.0">
            </div>
        </div>
    </details>
    </div>

    <button class="btn-export" onclick="exportMapToPNG()">📸 Export Map to PNG</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const map = L.map('map', { preferCanvas: true }).setView([36.2048, 138.2529], 5);

map.createPane('maskPane');
map.getPane('maskPane').style.zIndex = 500; 
map.getPane('maskPane').style.pointerEvents = 'none'; 

const tileUrls = {
    light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    white: '' 
};

let currentBaseLayer = null; 
let activeLayers = [];
let rawData = null;
let japanGeoData = null;
let zoomHandler = null; 

let globalMaskLayer = null;

const customColorScales = {
    'inferno': ['#000004', '#20114b', '#57106e', '#89226a', '#bc3754', '#e35932', '#f9cb35', '#fcffa4'],
    'magma': ['#000004', '#180f3d', '#440f76', '#721f81', '#9e2f7f', '#cd4071', '#f1605d', '#fd9668', '#fcfdbf'],
    'viridis': ['#440154', '#482878', '#3e4a89', '#31688e', '#26828e', '#1f9e89', '#35b779', '#6ece58', '#b5de2b', '#fde725']
};

let lastParsedTagsKey = null;
let parsedPoints = [];
let matchCount = 0;
let parsedPointsByTag = new Map();
let matchCountByTag = new Map();

const tagColorPalette = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#00acc1', '#fdd835', '#6d4c41', '#d81b60', '#7cb342'];

let isPrefectureCached = false;
let lastGridRes = -1;
let lastGridType = null;
let cachedGridFeatures = [];
let cachedAutoMax = -1;

document.getElementById('fileStatus').innerText = "Downloading Japan map borders...";
fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
    .then(response => response.json())
    .then(data => {
        japanGeoData = data;
        
        let maskRings = [
            [[-360, 90], [360, 90], [360, -90], [-360, -90], [-360, 90]] 
        ];
        
        japanGeoData.features.forEach(feature => {
            if (feature.geometry.type === 'Polygon') {
                maskRings.push(feature.geometry.coordinates[0].slice().reverse());
            } else if (feature.geometry.type === 'MultiPolygon') {
                feature.geometry.coordinates.forEach(poly => {
                    maskRings.push(poly[0].slice().reverse());
                });
            }
        });

        globalMaskLayer = L.geoJSON({
            type: 'Feature',
            geometry: { type: 'Polygon', coordinates: maskRings }
        }, {
            pane: 'maskPane',
            style: { fillColor: '#ffffff', fillOpacity: 1, weight: 0, stroke: false },
            interactive: false
        });

        document.getElementById('fileStatus').innerText = "Map borders loaded. Waiting for JSON.";
        updateMap();
    })
    .catch(err => { document.getElementById('fileStatus').innerHTML = `<span style="color:red">Failed to load borders: ${err.message}</span>`; });

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileStatus').innerText = `Loading ${file.name}...`;
    const reader = new FileReader();
    reader.onload = function(event) {
        try {
            rawData = JSON.parse(event.target.result);
            if (!rawData.customCoordinates) throw new Error("Missing 'customCoordinates' array.");
            
            const uniqueTags = new Set();
            rawData.customCoordinates.forEach(loc => {
                if (loc.extra && loc.extra.tags) {
                    loc.extra.tags.forEach(tag => uniqueTags.add(tag));
                }
            });
            
            const dataList = document.getElementById('tagSuggestions');
            dataList.innerHTML = '';
            uniqueTags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                dataList.appendChild(option);
            });

            lastParsedTagsKey = null; 
            updateMap(); 
        } catch (err) {
            document.getElementById('fileStatus').innerHTML = `<span style="color:red">Invalid JSON:</span><br>${err.message}`;
        }
    };
    reader.readAsText(file);
    e.target.value = ''; 
});

['mapType', 'colorMap', 'autoMax', 'clipCoast'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => updateMap());
});

const tagSelectorsContainer = document.getElementById('tagSelectors');
document.getElementById('addTagSelectorBtn').addEventListener('click', () => {
    tagSelectorsContainer.appendChild(createTagSelectorRow('', true));
    updateMap();
});

tagSelectorsContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-tag-selector-btn')) {
        e.target.closest('.tag-selector-row').remove();
        updateMap();
    }
});

tagSelectorsContainer.addEventListener('change', (e) => {
    if (e.target.classList.contains('target-tag-input')) updateMap();
});

tagSelectorsContainer.addEventListener('keyup', (e) => {
    if (e.target.classList.contains('target-tag-input') && e.key === 'Enter') updateMap();
});

tagSelectorsContainer.addEventListener('focusout', (e) => {
    if (e.target.classList.contains('target-tag-input')) updateMap();
});

function applyBaseMap(val, shouldUpdate = true) {
    const isDark = val === 'dark' || val === 'satellite';
    
    document.body.classList.toggle('dark-mode', isDark);
    if (currentBaseLayer) map.removeLayer(currentBaseLayer);
    
    if (val !== 'white') {
        currentBaseLayer = L.tileLayer(tileUrls[val], { maxZoom: 19, crossOrigin: true }).addTo(map);
        map.getContainer().style.background = ''; 
    } else {
        currentBaseLayer = null;
        map.getContainer().style.background = '#ffffff'; 
    }
    if (shouldUpdate) updateMap();
}

document.getElementById('baseMap').addEventListener('change', (e) => {
    applyBaseMap(e.target.value);
});

applyBaseMap(document.getElementById('baseMap').value, false);

let updateTimeout;
function scheduleUpdate() {
    clearTimeout(updateTimeout);
    updateTimeout = setTimeout(updateMap, 150);
}

const syncControls = ['minLocs', 'maxLocs', 'opacity', 'resolution', 'blur', 'intensity', 'borderWeight', 'clusterReach', 'faintness'];
syncControls.forEach(id => {
    const slider = document.getElementById(id);
    const input = document.getElementById(id + 'Input');
    
    slider.addEventListener('input', () => {
        input.value = slider.value;
        scheduleUpdate();
    });
    
    input.addEventListener('change', () => {
        let val = parseFloat(input.value);
        if (!isNaN(val)) {
            val = Math.max(slider.min, Math.min(slider.max, val));
            input.value = val;
            slider.value = val;
            scheduleUpdate();
        }
    });
});

function getScaledSize(baseValue, currentZoom, baseZoom) {
    let scale = Math.pow(1.3, currentZoom - baseZoom);
    return Math.min(baseValue * scale, 120);
}

function escapeHtml(text) {
    const htmlEscapes = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    };
    return String(text).replace(/[&<>"']/g, ch => htmlEscapes[ch]);
}

function sanitizeFilenameSegment(text) {
    const normalized = String(text).trim();
    const sanitized = normalized.replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').replace(/\s+/g, ' ');
    return sanitized || 'Full';
}

function getTagColor(index) {
    return tagColorPalette[index % tagColorPalette.length];
}

function getTagInputs() {
    return Array.from(document.querySelectorAll('.target-tag-input'));
}

function getSelectedTags() {
    const selectedTags = [];
    const seen = new Set();
    getTagInputs().forEach(input => {
        const tag = input.value.trim();
        if (tag !== '' && !seen.has(tag)) {
            seen.add(tag);
            selectedTags.push(tag);
        }
    });
    return selectedTags;
}

function createTagSelectorRow(initialValue = '', includeRemoveButton = true) {
    const row = document.createElement('div');
    row.className = 'tag-selector-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'target-tag-input';
    input.value = initialValue;
    input.setAttribute('list', 'tagSuggestions');
    row.appendChild(input);

    if (includeRemoveButton) {
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'tag-selector-btn remove-tag-selector-btn';
        removeBtn.setAttribute('aria-label', 'Remove tag selector');
        removeBtn.innerText = '−';
        row.appendChild(removeBtn);
    }

    return row;
}

function parseTargetTags() {
    const selectedTags = getSelectedTags();
    const tagKey = selectedTags.join('|');
    if (tagKey === lastParsedTagsKey) return;
    
    parsedPoints = [];
    matchCount = 0;
    parsedPointsByTag = new Map();
    matchCountByTag = new Map();
    selectedTags.forEach(tag => {
        parsedPointsByTag.set(tag, []);
        matchCountByTag.set(tag, 0);
    });
    
    if (rawData && rawData.customCoordinates && selectedTags.length > 0) {
        rawData.customCoordinates.forEach(loc => {
            const tags = (loc.extra && loc.extra.tags) ? loc.extra.tags : [];
            if (!Number.isFinite(loc.lat) || !Number.isFinite(loc.lng) || tags.length === 0) return;

            let includedInCombined = false;
            selectedTags.forEach(targetTag => {
                if (tags.includes(targetTag)) {
                    const point = turf.point([loc.lng, loc.lat], { lat: loc.lat, lng: loc.lng });
                    parsedPointsByTag.get(targetTag).push(point);
                    matchCountByTag.set(targetTag, (matchCountByTag.get(targetTag) || 0) + 1);
                    if (!includedInCombined) {
                        parsedPoints.push(point);
                        matchCount++;
                        includedInCombined = true;
                    }
                }
            });
        });

        const baseStatus = `<b>Success!</b> Loaded file.<br>Total locations: ${rawData.customCoordinates.length}`;
        const tagStatusLines = selectedTags.map(tag => `"${escapeHtml(tag)}": <b>${matchCountByTag.get(tag) || 0}</b>`).join('<br>');
        document.getElementById('fileStatus').innerHTML = `${baseStatus}<hr>Matched locations (unique): <b>${matchCount}</b><br>${tagStatusLines}`;
    } else if (rawData && rawData.customCoordinates) {
        document.getElementById('fileStatus').innerHTML = `<b>Success!</b> Loaded file.<br>Total locations: ${rawData.customCoordinates.length}<hr>Select at least one target tag.`;
    }
    
    isPrefectureCached = false;
    lastGridRes = -1;
    lastGridType = null;
    cachedAutoMax = -1;
    lastParsedTagsKey = tagKey;
}

function updateMap() {
    if (!japanGeoData) return;
    parseTargetTags();
    
    activeLayers.forEach(layer => map.removeLayer(layer));
    activeLayers = [];
    if (zoomHandler) {
        map.off('zoomend', zoomHandler);
        zoomHandler = null;
    }
    
    if (globalMaskLayer && map.hasLayer(globalMaskLayer)) {
        map.removeLayer(globalMaskLayer);
    }

    const mapType = document.getElementById('mapType').value;
    const isAutoMax = document.getElementById('autoMax').checked;
    const clipCoast = document.getElementById('clipCoast').checked;
    
    const minLocs = parseInt(document.getElementById('minLocsInput').value, 10);
    const clusterReach = parseInt(document.getElementById('clusterReachInput').value, 10);
    
    const resolution = parseInt(document.getElementById('resolutionInput').value, 10);
    const blurValue = parseInt(document.getElementById('blurInput').value, 10);
    const faintness = parseFloat(document.getElementById('faintnessInput').value) / 100; 
    
    const colorMapName = document.getElementById('colorMap').value;
    const opacity = parseFloat(document.getElementById('opacityInput').value);
    const intensity = parseFloat(document.getElementById('intensityInput').value);
    const borderWeight = parseFloat(document.getElementById('borderWeightInput').value);
    
    const baseMapVal = document.getElementById('baseMap').value;
    const isDark = baseMapVal === 'dark' || baseMapVal === 'satellite';
    const borderColor = isDark ? '#ffffff' : '#000000';
    const selectedTags = getSelectedTags();
    const isMultiTagMode = selectedTags.length > 1;
    const tagEntries = selectedTags.map((tag, index) => ({
        tag,
        color: getTagColor(index),
        points: parsedPointsByTag.get(tag) || [],
        count: matchCountByTag.get(tag) || 0
    }));

    let pts = turf.featureCollection(parsedPoints);
    let actualMax = 0;

    if (mapType === 'prefecture') {
        if (!isPrefectureCached) {
            japanGeoData.features.forEach(feature => {
                if (isMultiTagMode) {
                    let totalCount = 0;
                    let dominantTag = null;
                    let dominantCount = 0;
                    tagEntries.forEach(entry => {
                        if (entry.count === 0) return;
                        const tagCount = turf.pointsWithinPolygon(turf.featureCollection(entry.points), feature).features.length;
                        totalCount += tagCount;
                        if (tagCount > dominantCount) {
                            dominantCount = tagCount;
                            dominantTag = entry;
                        }
                    });
                    feature.properties.loc_count = totalCount;
                    feature.properties.dominant_tag = dominantTag ? dominantTag.tag : '';
                    feature.properties.dominant_color = dominantTag ? dominantTag.color : 'transparent';
                } else {
                    feature.properties.loc_count = matchCount > 0 ? turf.pointsWithinPolygon(pts, feature).features.length : 0;
                }
            });
            isPrefectureCached = true;
        }
        actualMax = Math.max(1, ...japanGeoData.features.map(f => f.properties.loc_count || 0));
    } 
    else if (mapType === 'squared' || mapType === 'hex' || mapType === 'circles') {
        if (lastGridRes !== resolution || lastGridType !== mapType) {
            if (matchCount > 0) {
                const bbox = turf.bbox(pts);
                if (bbox[0] !== bbox[2] && bbox[1] !== bbox[3]) {
                    let grid = (mapType === 'hex') 
                        ? turf.hexGrid(bbox, resolution, { units: 'kilometers' }) 
                        : turf.squareGrid(bbox, resolution, { units: 'kilometers' });
                        
                    grid.features.forEach(feature => {
                        if (isMultiTagMode) {
                            let totalCount = 0;
                            let dominantTag = null;
                            let dominantCount = 0;
                            tagEntries.forEach(entry => {
                                if (entry.count === 0) return;
                                const tagCount = turf.pointsWithinPolygon(turf.featureCollection(entry.points), feature).features.length;
                                totalCount += tagCount;
                                if (tagCount > dominantCount) {
                                    dominantCount = tagCount;
                                    dominantTag = entry;
                                }
                            });
                            feature.properties.loc_count = totalCount;
                            feature.properties.dominant_tag = dominantTag ? dominantTag.tag : '';
                            feature.properties.dominant_color = dominantTag ? dominantTag.color : 'transparent';
                        } else {
                            feature.properties.loc_count = turf.pointsWithinPolygon(pts, feature).features.length;
                        }
                    });
                    cachedGridFeatures = grid.features;
                } else { cachedGridFeatures = []; }
            } else { cachedGridFeatures = []; }
            lastGridRes = resolution;
            lastGridType = mapType;
        }
        actualMax = cachedGridFeatures.length > 0 ? Math.max(...cachedGridFeatures.map(f => f.properties.loc_count)) : matchCount;
    }

    if ((mapType === 'fuzzy' || mapType === 'fuzzy_solid') && isAutoMax) {
        if (cachedAutoMax === -1 && matchCount > 0) {
            const bbox = turf.bbox(pts);
            if (bbox[0] !== bbox[2]) {
                const grid = turf.squareGrid(bbox, 20, { units: 'kilometers' });
                let localMax = 0;
                grid.features.forEach(f => {
                    const count = turf.pointsWithinPolygon(pts, f).features.length;
                    if (count > localMax) localMax = count;
                });
                cachedAutoMax = localMax;
            } else { cachedAutoMax = matchCount; }
        }
        actualMax = isAutoMax ? cachedAutoMax : matchCount;
    }

    actualMax = Math.max(1, actualMax);
    
    document.getElementById('maxLocs').disabled = isAutoMax;
    document.getElementById('maxLocsInput').disabled = isAutoMax;
    
    let effectiveMaxLocs = parseInt(document.getElementById('maxLocsInput').value, 10);
    if (isAutoMax) {
        effectiveMaxLocs = actualMax;
        document.getElementById('maxLocsInput').value = actualMax;
    }

    let scale;
    try {
        let scaleData = customColorScales[colorMapName] || colorMapName;
        scale = chroma.scale(scaleData).domain([0, effectiveMaxLocs]);
    } catch(err) {
        scale = chroma.scale(customColorScales['inferno']).domain([0, effectiveMaxLocs]); 
    }

    if (mapType === 'prefecture') {
        const geoLayer = L.geoJSON(japanGeoData, {
            style: function(feature) {
                const count = feature.properties.loc_count;
                if (count >= minLocs) {
                    const cappedCount = Math.min(count, effectiveMaxLocs);
                    const fillColor = isMultiTagMode ? (feature.properties.dominant_color || '#999999') : scale(cappedCount).hex();
                    return { fillColor, weight: borderWeight, opacity: borderWeight > 0 ? 0.8 : 0, color: borderColor, fillOpacity: opacity };
                } else {
                    return { fillColor: 'transparent', weight: borderWeight, opacity: borderWeight > 0 ? 0.3 : 0, color: borderColor, fillOpacity: 0 };
                }
            },
            onEachFeature: function(feature, layer) {
                const dominantInfo = isMultiTagMode && feature.properties.dominant_tag
                    ? `<br>Top tag: ${escapeHtml(feature.properties.dominant_tag)}`
                    : '';
                layer.bindTooltip(`<b>${feature.properties.nam_ja || "Prefecture"}</b><br>${feature.properties.loc_count || 0} locations${dominantInfo}`, { sticky: true });
            }
        }).addTo(map);
        activeLayers.push(geoLayer);
    } 
    else if (mapType === 'squared' || mapType === 'hex' || mapType === 'circles') {
        if (cachedGridFeatures.length > 0) {
            const filteredGrid = cachedGridFeatures.filter(f => f.properties.loc_count >= minLocs);
            
            if (mapType === 'circles') {
                filteredGrid.forEach(feature => {
                    const centroid = turf.centroid(feature);
                    const latlng = [centroid.geometry.coordinates[1], centroid.geometry.coordinates[0]];
                    const cappedCount = Math.min(feature.properties.loc_count, effectiveMaxLocs);
                    
                    const circle = L.circle(latlng, {
                        radius: (resolution * 1000) / 2, 
                        fillColor: isMultiTagMode ? (feature.properties.dominant_color || '#999999') : scale(cappedCount).hex(),
                        fillOpacity: opacity,
                        color: borderColor,
                        weight: borderWeight > 0 ? 0.5 : 0,
                        opacity: borderWeight > 0 ? 1 : 0
                    }).bindTooltip(`<b>Density Area</b><br>${feature.properties.loc_count} locations${isMultiTagMode && feature.properties.dominant_tag ? `<br>Top tag: ${escapeHtml(feature.properties.dominant_tag)}` : ''}`, { sticky: true });
                    
                    circle.addTo(map);
                    activeLayers.push(circle);
                });
            } else {
                const gridLayer = L.geoJSON(filteredGrid, {
                    style: function(feature) {
                        const cappedCount = Math.min(feature.properties.loc_count, effectiveMaxLocs);
                        const fillColor = isMultiTagMode ? (feature.properties.dominant_color || '#999999') : scale(cappedCount).hex();
                        return { fillColor, weight: borderWeight > 0 ? 0.5 : 0, opacity: 1, color: borderColor, fillOpacity: opacity };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.bindTooltip(`<b>Grid Sector</b><br>${feature.properties.loc_count} locations${isMultiTagMode && feature.properties.dominant_tag ? `<br>Top tag: ${escapeHtml(feature.properties.dominant_tag)}` : ''}`, { sticky: true });
                    }
                }).addTo(map);
                activeLayers.push(gridLayer);
            }
        }
        
        const outlineLayer = L.geoJSON(japanGeoData, { style: { fillColor: 'transparent', weight: borderWeight, color: borderColor, opacity: borderWeight > 0 ? 0.4 : 0 }, interactive: false }).addTo(map);
        activeLayers.push(outlineLayer);
    }
    else if (mapType === 'fuzzy' || mapType === 'fuzzy_solid') {
        const heatLayers = [];
        const heatSourceEntries = isMultiTagMode ? tagEntries.filter(entry => entry.points.length > 0) : [{ points: pts.features }];

        heatSourceEntries.forEach(sourceEntry => {
            let sourcePoints = sourceEntry.points;
            if (minLocs > 1 && sourcePoints.length > 0) {
                let clustered = turf.clustersDbscan(turf.featureCollection(sourcePoints), clusterReach, { units: 'kilometers', minPoints: minLocs });
                sourcePoints = clustered.features.filter(f => f.properties.dbscan !== 'noise');
            }

            const heatPoints = sourcePoints.map(f => [f.properties.lat, f.properties.lng, intensity]);
            if (heatPoints.length === 0) return;

            let heatGradient = {};
            if (faintness > 0) {
                heatGradient[faintness] = 'rgba(0,0,0,0)';
            }
            for (let i = Math.max(0.05, faintness + 0.05); i <= 1.0; i += 0.05) {
                heatGradient[i] = isMultiTagMode
                    ? chroma(sourceEntry.color).alpha(Math.min(1, i)).css()
                    : scale(i * effectiveMaxLocs).hex();
            }
            if (!heatGradient[1.0]) heatGradient[1.0] = isMultiTagMode ? sourceEntry.color : scale(effectiveMaxLocs).hex();

            const BASE_ZOOM = 5;
            const finalHeatMax = Math.max(0.001, effectiveMaxLocs / intensity);
            const isSolid = mapType === 'fuzzy_solid';

            const heatLayer = L.heatLayer(heatPoints, {
                radius: getScaledSize(resolution, map.getZoom(), BASE_ZOOM),
                blur: getScaledSize(blurValue, map.getZoom(), BASE_ZOOM),
                max: finalHeatMax,
                minOpacity: isSolid ? 0.95 : 0.2,
                gradient: heatGradient
            }).addTo(map);

            heatLayers.push(heatLayer);
            activeLayers.push(heatLayer);
        });

        document.querySelectorAll('.leaflet-heatmap-layer').forEach(canvas => {
            canvas.style.opacity = opacity;
        });

        if (heatLayers.length > 0 && clipCoast && globalMaskLayer) {
            let maskColor = '#ffffff'; 
            if (baseMapVal === 'light') maskColor = '#d4dadc'; 
            if (baseMapVal === 'dark') maskColor = '#0e0e0e'; 
            if (baseMapVal === 'satellite') maskColor = '#000000'; 

            globalMaskLayer.setStyle({ fillColor: maskColor });
            globalMaskLayer.addTo(map);
            activeLayers.push(globalMaskLayer); 
        }

        if (heatLayers.length > 0) {
            const outlineLayer = L.geoJSON(japanGeoData, { 
                pane: 'maskPane', 
                style: { fillColor: 'transparent', weight: borderWeight, color: borderColor, opacity: borderWeight > 0 ? 0.6 : 0 }, 
                interactive: false 
            }).addTo(map);
            activeLayers.push(outlineLayer);

            zoomHandler = function() {
                heatLayers.forEach(heatLayer => {
                    if (map.hasLayer(heatLayer)) {
                        heatLayer.setOptions({
                            radius: getScaledSize(resolution, map.getZoom(), BASE_ZOOM),
                            blur: getScaledSize(blurValue, map.getZoom(), BASE_ZOOM)
                        });
                    }
                });
            };
            map.on('zoomend', zoomHandler);
        }
    }
}

function exportMapToPNG() {
    if (!japanGeoData) return;

    const mapElement = document.getElementById('map');
    const btn = document.querySelector('.btn-export');
    const controls = document.querySelector('.leaflet-control-container');

    const originalCenter = map.getCenter();
    const originalZoom = map.getZoom();

    btn.disabled = true;
    btn.innerText = "📸 Loading Full Map...";
    if (controls) controls.style.display = 'none';

    const mainJapanBounds = L.latLngBounds([
        [30.0, 128.0],
        [45.5, 149.0]
    ]);
    
    map.fitBounds(mainJapanBounds, { animate: false });

    setTimeout(() => {
        btn.innerText = "📸 Rendering High-Res Image...";

        html2canvas(mapElement, {
            useCORS: true,
            allowTaint: false,
            backgroundColor: null,
            scale: 4
        }).then(canvas => {
            const link = document.createElement('a');
            const tagValue = getSelectedTags().join('+') || 'Full';
            link.download = `DensityMap_${sanitizeFilenameSegment(tagValue)}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            restoreState();
        }).catch(err => {
            alert("Export failed: " + err);
            restoreState();
        });
    }, 2000);

    function restoreState() {
        map.setView(originalCenter, originalZoom, { animate: false });
        if (controls) controls.style.display = '';
        btn.disabled = false;
        btn.innerText = "✅ Export Complete!";
        setTimeout(() => {
            btn.innerText = "📸 Export Map to PNG";
        }, 3000);
    }
}
</script>
